[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "contract-analyzer"
version = "0.1.0"
description = "Extract key clauses from supplier contracts and flag the risky ones"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "jinja2>=3.1",
    "openai>=2.36.0",
    "pdfplumber>=0.11.9",
    "pydantic>=2.9.0",
    "python-dotenv>=1.2.2",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.14.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["contracts*"]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes: undefined names, unused imports
    "I",      # isort: import sorting
    "N",      # pep8-naming
    "UP",     # pyupgrade: modernize syntax
    "B",      # flake8-bugbear: likely bugs, footguns
    "SIM",    # flake8-simplify
    "D",      # pydocstyle: docstring presence and format
    "ANN",    # flake8-annotations: missing type hints
    "TID",    # flake8-tidy-imports: ban relative imports
    "PL",     # Pylint subset (too-many-args, etc.)
    "RUF",    # Ruff-native rules
]
ignore = [
    "D203",   # conflicts with D211
    "D213",   # conflicts with D212
]

[tool.ruff.lint.per-file-ignores]
# Test names are the documentation, and a test asserts on literals by design.
"tests/**" = ["D100", "D103", "ANN", "PLR2004"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.isort]
known-first-party = ["contracts"]

[tool.ruff.lint.pylint]
max-args = 5

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true
